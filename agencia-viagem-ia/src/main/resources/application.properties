quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b
quarkus.langchain4j.ollama.timeout=300s

#quarkus.langchain4j.easy-rag.path=src/main/resources/rag
#quarkus.langchain4j.easy-rag.max-segment-size=100
#quarkus.langchain4j.easy-rag.max-segment-overlap=20

quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text

quarkus.langchain4j.pgvector.register-vector-pg-extension=true
quarkus.langchain4j.pgvector.dimension=768
quarkus.langchain4j.pgvector.table=travel_embeddings
quarkus.langchain4j.pgvectordrop-table-first=true

# Configuração de logging do LangChain4j
# Registra a requisição completa enviada ao LLM, incluindo o manifesto de ferramentas
quarkus.langchain4j.log-requests=true
# Registra a resposta completa recebida do LLM, incluindo chamadas de ferramentas
quarkus.langchain4j.log-responses=true

# Cliente MCP chamado "booking-server"
quarkus.langchain4j.mcp.booking-server.transport-type=streamable-http
quarkus.langchain4j.mcp.booking-server.url=http://localhost:8081/mcp

# Timeout para o handshake com o servidor MCP
quarkus.langchain4j.mcp.booking-server.timeout=30s

# Logging das requisições e respostas MCP
quarkus.langchain4j.mcp.booking-server.log-requests=true
quarkus.langchain4j.mcp.booking-server.log-responses=true

# Máximo de tentativas de autocorreção antes de lançar um erro
quarkus.langchain4j.guardrails.max-retries=3
